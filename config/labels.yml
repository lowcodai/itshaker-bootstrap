# config/labels.yml
# Standard GitHub labels created by init-labels.sh
# Format: name, color (hex without #), description

labels:
  # Issue type
  - name: "type: bug"
    color: "d73a4a"
    description: "Something isn't working"
  - name: "type: feature"
    color: "0075ca"
    description: "New feature or enhancement"
  - name: "type: chore"
    color: "e4e669"
    description: "Maintenance task, refactoring"
  - name: "type: docs"
    color: "0052cc"
    description: "Documentation only"
  - name: "type: security"
    color: "b60205"
    description: "Security issue"
  - name: "type: adr"
    color: "5319e7"
    description: "Architecture Decision Record"

  # Priority
  - name: "priority: critical"
    color: "b60205"
    description: "Critical priority — must be addressed immediately"
  - name: "priority: high"
    color: "e99695"
    description: "High priority"
  - name: "priority: medium"
    color: "fbca04"
    description: "Medium priority"
  - name: "priority: low"
    color: "c2e0c6"
    description: "Low priority"

  # Status
  - name: "status: in-progress"
    color: "0075ca"
    description: "Currently being worked on"
  - name: "status: blocked"
    color: "d93f0b"
    description: "Blocked — awaiting resolution"
  - name: "status: needs-review"
    color: "fbca04"
    description: "Awaiting review"
  - name: "status: wontfix"
    color: "ffffff"
    description: "Will not be fixed"

  # Component
  - name: "component: ci-cd"
    color: "1d76db"
    description: "CI/CD pipeline"
  - name: "component: docs"
    color: "0052cc"
    description: "Documentation"
  - name: "component: governance"
    color: "5319e7"
    description: "Governance and policies"
  - name: "component: security"
    color: "b60205"
    description: "Security"

  # Copilot-specific
  - name: "copilot: agent"
    color: "7b2d8b"
    description: "Related to Copilot agents"
  - name: "copilot: skill"
    color: "7b2d8b"
    description: "Related to Copilot skills"
  - name: "copilot: instruction"
    color: "7b2d8b"
    description: "Related to Copilot instructions"
